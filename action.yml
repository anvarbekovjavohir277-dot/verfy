name: Verfy Lock
description: Fail the check when an MCP tool your agents use changed since it was locked in verfy.lock.
author: Verfy
branding:
  icon: lock
  color: blue

inputs:
  config:
    description: MCP config whose servers are checked. Stdio servers are started; remote servers are called with the headers in the config, where ${VAR} comes from the step's env.
    default: .mcp.json
  lock:
    description: The committed lock file to compare with.
    default: verfy.lock
  servers:
    description: Optional space-separated server names to check (default all servers in the config).
    default: ""
  require-pinned:
    description: Fail when a server is started with no exact package version (npx pkg@latest, uvx pkg). Set to "true" to turn it on.
    default: "false"
  sarif:
    description: Optional path to also write the result as SARIF 2.1.0, to upload to GitHub code scanning with github/codeql-action/upload-sarif.
    default: ""

runs:
  using: composite
  steps:
    - name: Install the Verfy CLI
      shell: bash
      run: |
        PY="$(command -v python3 || command -v python)"
        "$PY" -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH/verfy-cli"
    - name: Compare tool definitions with the lock
      shell: bash
      env:
        VERFY_CONFIG: ${{ inputs.config }}
        VERFY_LOCK: ${{ inputs.lock }}
        VERFY_SERVERS: ${{ inputs.servers }}
        VERFY_REQUIRE_PINNED: ${{ inputs.require-pinned }}
        VERFY_SARIF: ${{ inputs.sarif }}
      run: |
        args=(lock check --config "$VERFY_CONFIG" --lock "$VERFY_LOCK")
        for s in $VERFY_SERVERS; do args+=(--server "$s"); done
        if [ "$VERFY_REQUIRE_PINNED" = "true" ]; then args+=(--require-pinned); fi
        if [ -n "$VERFY_SARIF" ]; then args+=(--sarif "$VERFY_SARIF"); fi
        verfy "${args[@]}"
