name: Publish CLI to PyPI

# Push a tag cli-vX.Y.Z (matching verfy-cli/pyproject.toml, verfy-cli/src/verfy/__init__.py and the top of CHANGELOG.md) to release.
# One run does all of it: tests, build, the end-to-end test of the built wheel on Linux, macOS and Windows
# (e2e.yml), PyPI (Trusted Publishing with attestations, no API token stored anywhere), then the GitHub
# release with the same files, SHA256SUMS and a Sigstore signature for each.
# `python scripts/bump.py X.Y.Z` sets the version in every file that carries it.
# The standalone builds in verfy-releases follow within six hours (that repository polls PyPI).
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('verfy-cli/src/verfy/__init__.py').read_text()).group(1))")
          test "cli-v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          grep -q "^version = \"$v\"$" verfy-cli/pyproject.toml || { echo "::error::verfy-cli/pyproject.toml is not at version $v"; exit 1; }
          grep -q "^## $v " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - name: Tests
        working-directory: verfy-cli
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation verfy-cli --outdir dist
          python -m twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/try/bin/verfy --version
          /tmp/try/bin/verfy check "npm test"
          set +e; /tmp/try/bin/verfy check "rm -rf ~"; test $? -eq 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  e2e:
    name: End-to-end on Linux, macOS and Windows
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      dist: dist

  publish:
    name: Upload to PyPI
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/verfy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Sigstore attestations (PEP 740) name the workflow that built each file; only for a public repository
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: ${{ github.event.repository.private == false }}

  github-release:
    name: GitHub release, SHA256SUMS and Sigstore signatures
    needs: publish
    # a release in a private repository helps nobody; the public builds are in verfy-releases
    if: startsWith(github.ref, 'refs/tags/cli-v') && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload files
      id-token: write # Sigstore signing
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # all tags, to tell whether this is the newest version
      # the exact files that went to PyPI
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: cd dist && sha256sum verfy-* > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/verfy-* ./dist/SHA256SUMS
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - name: Create the release from CHANGELOG.md and attach the files
        run: bash .github/scripts/github-release.sh "$TAG" dist
