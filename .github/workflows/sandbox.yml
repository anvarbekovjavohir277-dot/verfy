name: Sandbox

# `verfy run --sandbox` against the real sandbox runtime, on the two systems it runs on. Verfy refuses on native Windows.
# scripts/e2e_sandbox.py checks what the operating system refuses; the unit tests stop where the runtime starts.
on:
  push:
    branches: [main]
    paths:
      - verfy-cli/src/verfy/cli.py
      - verfy-cli/src/verfy/sandbox.py
      - scripts/e2e_sandbox.py
      - scripts/e2e_wsl.py
      - .github/workflows/sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: Sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # counts the wait for a runner too, and a macOS runner can take a long time to get
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: What the runtime needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap socat ripgrep
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: What the runtime needs on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: The sandbox runtime
        # versions and integrity hashes: .github/requirements/npm-sandbox/package-lock.json
        run: |
          mkdir -p "$RUNNER_TEMP/npm-sandbox"
          cp .github/requirements/npm-sandbox/package.json .github/requirements/npm-sandbox/package-lock.json "$RUNNER_TEMP/npm-sandbox/"
          npm ci --prefix "$RUNNER_TEMP/npm-sandbox" --no-audit --no-fund
          echo "$RUNNER_TEMP/npm-sandbox/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build and install Verfy
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation --wheel verfy-cli --outdir dist
          python -m pip install --disable-pip-version-check --no-deps dist/verfy-*.whl
      - name: End-to-end
        run: python scripts/e2e_sandbox.py

  wsl:
    name: Sandbox (Windows, WSL2)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: bubblewrap socat ripgrep python3-pip python3-venv curl ca-certificates xz-utils
      - name: Node and the sandbox runtime inside WSL2
        run: |
          # the checksum is from https://nodejs.org/dist/v24.11.0/SHASUMS256.txt
          curl -fsSL -o /tmp/node.tar.xz https://nodejs.org/dist/v24.11.0/node-v24.11.0-linux-x64.tar.xz
          echo "46da9a098973ab7ba4fca76945581ecb2eaf468de347173897044382f10e0a0a  /tmp/node.tar.xz" | sha256sum -c -
          tar -xJ -C /opt -f /tmp/node.tar.xz
          ln -sf /opt/node-v24.11.0-linux-x64/bin/* /usr/local/bin/
          # versions and integrity hashes: .github/requirements/npm-sandbox/package-lock.json
          mkdir -p /opt/npm-sandbox
          cp .github/requirements/npm-sandbox/package.json .github/requirements/npm-sandbox/package-lock.json /opt/npm-sandbox/
          npm ci --prefix /opt/npm-sandbox --no-audit --no-fund
          ln -sf /opt/npm-sandbox/node_modules/.bin/* /usr/local/bin/
      - name: Verfy inside WSL2
        run: |
          rm -rf /tmp/src && cp -r . /tmp/src && cd /tmp/src
          python3 -m venv /opt/v
          /opt/v/bin/pip install --disable-pip-version-check --require-hashes -r .github/requirements/build.txt
          /opt/v/bin/python -m build --no-isolation --wheel verfy-cli --outdir dist
          /opt/v/bin/pip install --disable-pip-version-check --no-deps dist/verfy-*.whl
          ln -sf /opt/v/bin/verfy /usr/local/bin/verfy
      - name: End-to-end inside WSL2
        run: cd /tmp/src && /opt/v/bin/python scripts/e2e_sandbox.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verfy on Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation --wheel verfy-cli --outdir dist-windows
          python -m pip install --disable-pip-version-check --no-deps (Get-Item dist-windows/verfy-*.whl).FullName
      - name: End-to-end from Windows
        shell: pwsh
        run: python scripts/e2e_wsl.py
