name: Research - MCP tool changes

# Starts third-party MCP servers (research/servers.json), several releases of each, and records
# their tool definitions. Runs every Monday and by hand. The job has no token permissions and no
# secrets: the packages run on a throwaway runner and never see a credential (the servers get
# placeholders). The results are artifacts; verfy.dev/servers is built from them.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Releases per server"
        default: "6"
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  list:
    name: Servers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ids
        run: echo "ids=$(python3 -c 'import json; print(json.dumps([s["id"] for s in json.load(open("research/servers.json"))]))')" >> "$GITHUB_OUTPUT"

  collect:
    name: ${{ matrix.id }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        id: ${{ fromJSON(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/research.txt
      - name: Collect
        env:
          ID: ${{ matrix.id }}
          VERSIONS: ${{ inputs.versions || '6' }}
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: python research/tool_history.py "$ID" --versions "$VERSIONS" --out "results/$ID.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.id }}
          path: results/
          retention-days: 90
