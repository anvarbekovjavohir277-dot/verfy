name: CLA

# Contributors sign CLA.md once by commenting on their pull request. Signatures are kept on the
# cla-signatures branch. The workflow never checks out or runs the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: read-all

jobs:
  cla:
    name: CLA signed
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write # commit the signature to the cla-signatures branch
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/verfy-dev/verfy/blob/main/CLA.md
          branch: cla-signatures
          allowlist: anvarbekovjavohir277-dot,dependabot[bot],github-actions[bot],*[bot]
