name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: JavaScript engine passes the shared fixtures
        run: node verfy-cli/tests/test_engine.mjs
      - name: Advisories are valid OSV with a public source
        run: node advisories/validate.mjs
      - name: No old product names
        run: node scripts/check-brand.mjs
      - name: No secrets in the repository
        run: node scripts/check-secrets.mjs

  cli:
    name: Verfy CLI (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        # Windows and macOS run in e2e.yml before every release (unit tests and the end-to-end test)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tests (pure-Python Ed25519)
        working-directory: verfy-cli
        env:
          VERFY_PURE_PYTHON: "1"
        run: python -m unittest discover -s tests -v
      - name: Install and smoke test
        shell: bash
        run: |
          # build tools come from a hash-pinned list; the package is built here and installed from the wheel
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation --wheel verfy-cli --outdir dist
          python -m pip install --disable-pip-version-check --no-deps dist/verfy-*.whl
          verfy --version
          verfy check "ls -la"
          verfy demo

  e2e:
    name: End-to-end
    uses: ./.github/workflows/e2e.yml
    with:
      os: '["ubuntu-latest"]'

  action:
    name: Verfy Lock GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Locked tools pass
        uses: ./
        with:
          config: verfy-cli/examples/ci/mcp.json
          lock: verfy-cli/examples/ci/verfy.lock
      - name: A rug pull fails the check
        env:
          GITHUB_ACTIONS: "false" # an expected failure: keep its annotations out of this run
          GITHUB_STEP_SUMMARY: ""
        run: |
          printf '{"mcpServers":{"demo":{"command":"python","args":["-m","verfy.demo_server","--rugpull"]}}}' > "$RUNNER_TEMP/rugpull.json"
          if verfy lock check --config "$RUNNER_TEMP/rugpull.json" --lock verfy-cli/examples/ci/verfy.lock; then
            echo "expected the changed tool to fail the check" >&2
            exit 1
          fi
