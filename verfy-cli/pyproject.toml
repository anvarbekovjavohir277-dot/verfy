[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verfy"
version = "0.23.0"
description = "Verfy: guard coding-agent tool calls, scan and lock MCP tools, and sign a verifiable receipt for every action."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javohir Anvarbekov", email = "contact@verfy.dev" }]
keywords = ["mcp", "ai-agents", "security", "model-context-protocol", "claude-code", "cursor", "lockfile", "rug-pull", "tool-poisoning", "audit", "receipts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://verfy.dev"
Documentation = "https://verfy.dev/docs"
Changelog = "https://verfy.dev/changelog"
Source = "https://github.com/anvarbekovjavohir277-dot/verfy"
Downloads = "https://github.com/anvarbekovjavohir277-dot/verfy-releases/releases"
Issues = "https://github.com/anvarbekovjavohir277-dot/verfy-releases/issues"
Security = "https://github.com/anvarbekovjavohir277-dot/verfy-releases/blob/main/SECURITY.md"

[project.optional-dependencies]
fast = ["cryptography>=43"]

[project.scripts]
verfy = "verfy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["verfy", "verfy.data"]

[tool.setuptools.package-data]
verfy = ["data/*.json"]
